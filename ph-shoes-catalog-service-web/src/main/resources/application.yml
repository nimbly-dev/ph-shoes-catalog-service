app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS}
    allowed-headers: ${CORS_ALLOWED_HEADERS}
    exposed-headers: []
    allow-credentials: ${CORS_ALLOW_CREDENTIALS}
    max-age: ${CORS_MAX_AGE}

server:
  port: ${PORT}
  servlet:
    context-path: /api/v1

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:snowflake://${SNOWFLAKE_ACCOUNT}.snowflakecomputing.com?warehouse=${SNOWFLAKE_WAREHOUSE}&db=${SNOWFLAKE_DATABASE}&schema=${SNOWFLAKE_SCHEMA}&role=${SNOWFLAKE_ROLE}&JDBC_QUERY_RESULT_FORMAT=JSON
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT}
      initialization-fail-timeout: ${DB_POOL_INIT_FAIL_TIMEOUT}
      data-source-properties:
        ENABLE_ARROW_RESULTSET: ${SNOWFLAKE_ENABLE_ARROW_RESULTSET}
  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL}
    hibernate:
      ddl-auto: none
    database-platform: com.nimbly.phshoesbackend.catalog.core.configs.dialect.SnowflakeDialect
    properties:
      hibernate:
        dialect: com.nimbly.phshoesbackend.catalog.core.configs.dialect.SnowflakeDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  sql:
    init:
      continue-on-error: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false

schema:
  migrations:
    enabled: false

phshoes:
  security:
    email:
      enabled: ${PHSHOES_SECURITY_EMAIL_ENABLED}
  status:
    enabled: true
    service-id: ph-shoes-catalog-service
    display-name: Shoe Catalog
    environment: ${APP_ENV}
    version: ${APP_VERSION}
    path: /system/status
  api:
    rate-limit:
      enabled: ${PHSHOES_API_RATE_LIMIT_ENABLED:${API_RATE_LIMIT_ENABLED:false}}
      default-window: ${PHSHOES_API_RATE_LIMIT_WINDOW:10m}
      global:
        enabled: ${PHSHOES_API_RATE_LIMIT_GLOBAL_ENABLED:${PHSHOES_API_RATE_LIMIT_ENABLED:${API_RATE_LIMIT_ENABLED:false}}}
        limit: ${PHSHOES_API_RATE_LIMIT_GLOBAL_LIMIT:10000}
      per-ip:
        enabled: ${PHSHOES_API_RATE_LIMIT_PER_IP_ENABLED:${PHSHOES_API_RATE_LIMIT_ENABLED:${API_RATE_LIMIT_ENABLED:false}}}
        limit: ${PHSHOES_API_RATE_LIMIT_PER_IP_LIMIT:200}
      per-user:
        enabled: ${PHSHOES_API_RATE_LIMIT_PER_USER_ENABLED:${PHSHOES_API_RATE_LIMIT_ENABLED:${API_RATE_LIMIT_ENABLED:false}}}
        limit: ${PHSHOES_API_RATE_LIMIT_PER_USER_LIMIT:200}
